services:
  postgres:
    image: postgres:17
    container_name: carisehat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carisehat}
      POSTGRES_USER: ${POSTGRES_USER:-hospital_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di file .env}
    ports:
      - "127.0.0.1:5433:5432" # 5433 agar tidak bentrok dengan PostgreSQL lain di laptop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro # *.sql dijalankan saat volume pertama dibuat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fuseki:
    build: ./fuseki
    container_name: carisehat-fuseki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - fusekidata:/fuseki-data

  backend:
    build: ./backend
    container_name: carisehat-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      fuseki:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hospital_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-carisehat}
      FUSEKI_URL: http://fuseki:3030/hospital
      BASE_URI: ${BASE_URI:-http://localhost:8000}
      BOOKING_ACCESS_KEY: ${BOOKING_ACCESS_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      IDEMPOTENCY_REPLAY_AS_409: ${IDEMPOTENCY_REPLAY_AS_409:-false}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/code/app
      - ./frontend:/frontend:ro
      - ./semantic:/semantic:ro
      - ./database:/database:ro # migrasi SQL dijalankan otomatis saat start
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  fusekidata:
