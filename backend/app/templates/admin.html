<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CariSehat Admin</title>
<style>
:root{--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--brand:#0b2a52;--blue:#2563eb;--ok:#059669;--warn:#d97706;--bad:#e11d48}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:1rem}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2rem;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
.login-card h1{margin:0 0 .25rem;font-size:1.4rem;color:var(--brand)}.login-card p{margin:0 0 1.2rem;color:var(--mute)}
label{display:block;font-size:12px;font-weight:600;color:#334155;margin:.7rem 0 .25rem}
input,select,textarea{width:100%;padding:.55rem .7rem;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.45rem .8rem;cursor:pointer;font-weight:600;color:#334155}
.btn:hover{background:#f8fafc}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.primary:hover{background:#12407a}
.btn.danger{color:var(--bad);border-color:#fecdd3}.btn.danger:hover{background:#fff1f2}.btn.sm{padding:.25rem .55rem;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--brand);color:#cbd5e1;padding:1rem .75rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside h2{color:#fff;margin:.2rem .5rem 1rem;font-size:1.1rem}
aside nav{flex:1;overflow:auto}
aside nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:.6rem .75rem;border-radius:8px;cursor:pointer;font-weight:600}
aside nav button:hover{background:rgba(255,255,255,.08)}aside nav button.on{background:#fff;color:var(--brand)}
.who{border-top:1px solid rgba(255,255,255,.15);padding:.8rem .5rem 0;font-size:12px}.who b{color:#fff;display:block}
main{padding:1.4rem;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.head h1{margin:0;font-size:1.35rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin-bottom:1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem}
.stat span{display:block;color:var(--mute);font-size:12px;font-weight:600}.stat b{font-size:1.7rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem}
.panel h3{margin:0 0 .7rem;font-size:1rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1rem}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}.filters>*{width:auto;min-width:150px}
.tablewrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}th,td{padding:.55rem .7rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f8fafc;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
tr:last-child td{border-bottom:0}td.act{white-space:nowrap}
.badge{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:11px;font-weight:700;background:#e2e8f0;color:#334155}
.b-menunggu{background:#fef3c7;color:#92400e}.b-dikonfirmasi,.b-selesai,.b-ok{background:#d1fae5;color:#065f46}.b-dibatalkan,.b-off{background:#ffe4e6;color:#9f1239}
.mute{color:var(--mute)}.small{font-size:12px}
.bar{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin-top:.25rem}.bar i{display:block;height:100%;background:var(--blue)}
.pager{display:flex;align-items:center;gap:.5rem;justify-content:flex-end;margin-top:.7rem}
#overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;place-items:center;padding:1rem;z-index:50}
#overlay.on{display:grid}.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:1.3rem}
.modal h3{margin:0 0 .5rem}.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.modal .foot{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}
#toast{position:fixed;right:1rem;bottom:1rem;display:grid;gap:.5rem;z-index:60}
.t{background:var(--ink);color:#fff;padding:.6rem .9rem;border-radius:10px;max-width:360px;box-shadow:0 6px 18px rgba(0,0,0,.2)}.t.err{background:var(--bad)}.t.ok{background:var(--ok)}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font-size:11px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:.5rem;max-height:220px;overflow:auto}
.err-msg{color:var(--bad);font-size:13px;margin-top:.6rem;min-height:1.2em}
@media(max-width:800px){#app{grid-template-columns:1fr}aside{position:static;height:auto}aside nav{display:flex;flex-wrap:wrap;gap:.25rem}aside nav button{width:auto}}
</style>
</head>
<body>

<section id="login">
  <form class="login-card" id="login-form" autocomplete="on">
    <h1>CariSehat Admin</h1>
    <p>Masuk untuk mengelola booking, kuota kamar, jadwal konsultasi, dan hak akses.</p>
    <label for="lu">Username</label><input id="lu" name="username" autocomplete="username" required>
    <label for="lp">Password</label><input id="lp" name="password" type="password" autocomplete="current-password" required>
    <div class="err-msg" id="login-err" role="alert"></div>
    <button class="btn primary" style="width:100%;margin-top:.5rem" id="login-btn">Masuk</button>
    <p class="small mute" style="margin-top:1rem">Demo akademik MSBD. Lupa password? Minta superadmin mereset di menu Pengguna.</p>
  </form>
</section>

<div id="app" class="hidden">
  <aside>
    <h2>CariSehat Admin</h2>
    <nav id="nav"></nav>
    <div class="who"><b id="who-name"></b><span id="who-role" class="mute"></span><br>
      <button class="btn sm" id="logout" style="margin-top:.5rem">Keluar</button> <a class="small" href="/" style="color:#93c5fd">Situs</a></div>
  </aside>
  <main id="view"></main>
</div>

<div id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" aria-live="polite"></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOKEN_KEY = 'cs_admin_token';
const S = { token: localStorage.getItem(TOKEN_KEY), me: null, rs: [], rsMap: {}, view: 'dashboard' };
const ROOMS = ['VIP', 'Kelas I', 'Kelas II', 'Kelas III', 'ICU'];
const HARI = ['', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];

function toast(msg, kind = '') {
  const el = document.createElement('div'); el.className = 't ' + kind; el.textContent = msg;
  $('#toast').appendChild(el); setTimeout(() => el.remove(), 4200);
}
async function api(path, opt = {}) {
  const headers = { Accept: 'application/json', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) };
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  const res = await fetch('/api/admin' + path, { ...opt, headers, body: opt.body ? JSON.stringify(opt.body) : undefined });
  let data = null; try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 401 && S.token && path !== '/login') { doLogout(true); }
    let d = data && data.detail; if (Array.isArray(d)) d = d.map(x => (x.loc || []).slice(1).join('.') + ': ' + x.msg).join('; ');
    throw new Error(d || ('HTTP ' + res.status));
  }
  return data;
}
const can = p => S.me && S.me.permissions.includes(p);
const qs = o => new URLSearchParams(Object.entries(o).filter(([, v]) => v !== '' && v != null)).toString();
const fmtDT = v => v ? new Date(v).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
const badge = s => `<span class="badge b-${esc(s)}">${esc(s)}</span>`;
const rsLabel = (id, name) => `<b>${esc(name || S.rsMap[id] || id)}</b><br><span class="mute small">${esc(id)}</span>`;

/* ---------- Modal & form ---------- */
function closeModal() { $('#overlay').classList.remove('on'); $('#modal').innerHTML = ''; }
$('#overlay').addEventListener('mousedown', e => { if (e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function field(f) {
  const v = f.value ?? '', id = 'f_' + f.name, req = f.required ? 'required' : '';
  let input;
  if (f.type === 'select') input = `<select id="${id}" ${req}>${f.options.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
  else if (f.type === 'rs') input = `<input id="${id}" list="rslist" value="${esc(v)}" placeholder="ketik rs-001 atau nama RS" ${req}>`;
  else if (f.type === 'textarea') input = `<textarea id="${id}" rows="3" ${req}>${esc(v)}</textarea>`;
  else if (f.type === 'checkbox') input = `<label style="display:flex;gap:.5rem;align-items:center;font-weight:500"><input style="width:auto" type="checkbox" id="${id}" ${v ? 'checked' : ''}> ${esc(f.hint || 'Aktif')}</label>`;
  else input = `<input id="${id}" type="${f.type || 'text'}" value="${esc(v)}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.minlength ? `minlength="${f.minlength}"` : ''} ${req} ${f.autocomplete ? `autocomplete="${f.autocomplete}"` : ''}>`;
  return `<div style="${f.wide ? 'grid-column:1/-1' : ''}">${f.type === 'checkbox' ? '' : `<label for="${id}">${esc(f.label)}</label>`}${input}</div>`;
}
function openForm({ title, fields, submitText = 'Simpan', onSubmit, note }) {
  const dl = `<datalist id="rslist">${S.rs.map(h => `<option value="${esc(h.id)}">${esc(h.nama)}</option>`).join('')}</datalist>`;
  $('#modal').innerHTML = `<form id="mform"><h3>${esc(title)}</h3>${note ? `<p class="mute small">${esc(note)}</p>` : ''}${dl}
    <div class="row">${fields.map(field).join('')}</div><div class="err-msg" id="merr" role="alert"></div>
    <div class="foot"><button type="button" class="btn" id="mcancel">Batal</button><button class="btn primary" id="msave">${esc(submitText)}</button></div></form>`;
  $('#overlay').classList.add('on');
  $('#mcancel').onclick = closeModal;
  const first = $('#mform input,#mform select,#mform textarea'); if (first) first.focus();
  $('#mform').onsubmit = async e => {
    e.preventDefault(); const vals = {};
    for (const f of fields) {
      const el = $('#f_' + f.name); let x = f.type === 'checkbox' ? el.checked : el.value.trim();
      if (f.type === 'rs') { const m = x.match(/rs-\d+/i); x = m ? m[0].toLowerCase() : x; }
      if (f.type === 'number') x = x === '' ? null : Number(x);
      if (f.nullable && x === '') x = null;
      vals[f.name] = x;
    }
    $('#msave').disabled = true;
    try { await onSubmit(vals); closeModal(); } catch (err) { $('#merr').textContent = err.message; $('#msave').disabled = false; }
  };
}
async function confirmAct(msg, fn) { if (!confirm(msg)) return; try { await fn(); } catch (e) { toast(e.message, 'err'); } }

/* ---------- Tabel generik ---------- */
function table(cols, rows, empty = 'Belum ada data.') {
  if (!rows.length) return `<div class="panel mute">${esc(empty)}</div>`;
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.cls || ''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function pager(st, total, render) {
  const from = total ? st.offset + 1 : 0, to = Math.min(st.offset + st.limit, total);
  return `<div class="pager"><span class="mute small">${from}–${to} dari ${total}</span>
    <button class="btn sm" data-pg="-1" ${st.offset <= 0 ? 'disabled' : ''}>‹ Sebelumnya</button>
    <button class="btn sm" data-pg="1" ${st.offset + st.limit >= total ? 'disabled' : ''}>Berikutnya ›</button></div>`;
}
function bindPager(root, st, reload) {
  root.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { st.offset = Math.max(0, st.offset + Number(b.dataset.pg) * st.limit); reload(); });
}
const rsOptions = (withAll) => [...(withAll ? [['', 'Semua RS']] : []), ...S.rs.map(h => [h.id, `${h.id} — ${h.nama}`])];

/* ---------- Views ---------- */
const VIEWS = {
  dashboard: { label: 'Dashboard', perm: 'dashboard.view', async render(el) {
    const d = await api('/dashboard'), s = d.stats;
    const max = Math.max(1, ...d.by_jenis.map(x => x.total));
    el.innerHTML = `<div class="head"><h1>Dashboard</h1><button class="btn" id="r">Muat ulang</button></div>
    <div class="cards">
      <div class="stat"><span>Rumah sakit (RDF)</span><b>${d.total_rs_rdf ?? '-'}</b></div>
      <div class="stat"><span>Total booking (SQL)</span><b>${s.total_booking}</b></div>
      <div class="stat"><span>Menunggu</span><b style="color:var(--warn)">${s.booking_menunggu}</b></div>
      <div class="stat"><span>Dikonfirmasi</span><b style="color:var(--ok)">${s.booking_dikonfirmasi}</b></div>
      <div class="stat"><span>Dibatalkan</span><b style="color:var(--bad)">${s.booking_dibatalkan}</b></div>
      <div class="stat"><span>Booking hari ini</span><b>${s.booking_hari_ini}</b></div>
      <div class="stat"><span>Jadwal dokter aktif</span><b>${s.jadwal_aktif}</b></div>
      <div class="stat"><span>Reservasi konsultasi aktif</span><b>${s.reservasi_aktif}</b></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Booking aktif per jenis kamar</h3>${d.by_jenis.map(x => `<div class="small"><b>${esc(x.jenis_kamar)}</b> — ${x.total}<div class="bar"><i style="width:${x.total / max * 100}%"></i></div></div>`).join('') || '<span class="mute">Belum ada.</span>'}</div>
      <div class="panel"><h3>RS dengan booking terbanyak</h3>${table([{ h: 'RS', f: r => rsLabel(r.rs_id, r.nama_rs) }, { h: 'Total', f: r => r.total }, { h: 'Menunggu', f: r => r.menunggu }], d.top_rs, 'Belum ada booking.')}</div>
      <div class="panel"><h3>Booking terbaru</h3>${table([{ h: 'Kode', f: r => esc(r.kode_booking) }, { h: 'Pasien', f: r => esc(r.nama_pasien) }, { h: 'RS', f: r => esc(r.nama_rs) }, { h: 'Status', f: r => badge(r.status) }], d.recent_booking, 'Belum ada booking.')}</div>
      <div class="panel"><h3>Kamar paling terbatas hari ini</h3>${table([{ h: 'RS', f: r => rsLabel(r.rs_id, r.nama_rs) }, { h: 'Kamar', f: r => esc(r.jenis_kamar) }, { h: 'Sisa', f: r => `${r.sisa_hari_ini}/${r.kapasitas}` }], d.okupansi, 'Belum ada kuota yang diatur.')}</div>
    </div>`;
    $('#r', el).onclick = () => show('dashboard');
  } },

  booking: { label: 'Booking Kamar', perm: 'booking.read', st: { limit: 15, offset: 0, status: '', kode_rs: '', q: '' }, async render(el) {
    const st = this.st;
    const reload = () => this.render(el);
    const d = await api('/bookings?' + qs(st));
    el.innerHTML = `<div class="head"><h1>Booking Kamar Rawat Inap</h1>${can('booking.write') ? '<button class="btn primary" id="add">+ Tambah booking</button>' : ''}</div>
    <div class="filters"><input id="q" placeholder="Cari pasien / kode / telepon" value="${esc(st.q)}">
      <select id="fs"><option value="">Semua status</option>${['menunggu', 'dikonfirmasi', 'dibatalkan'].map(x => `<option ${st.status === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <input id="frs" list="rslist2" placeholder="Filter rs-xxx" value="${esc(st.kode_rs)}"><datalist id="rslist2">${S.rs.map(h => `<option value="${esc(h.id)}">${esc(h.nama)}</option>`).join('')}</datalist></div>
    ${table([
      { h: 'Kode', f: r => `<b>${esc(r.kode_booking)}</b><br><span class="mute small">${fmtDT(r.created_at)}</span>` },
      { h: 'Rumah sakit', f: r => rsLabel(r.kode_rs, r.nama_rs) },
      { h: 'Pasien', f: r => `${esc(r.nama_pasien)}<br><span class="mute small">${esc(r.no_telp)}</span>` },
      { h: 'Kamar', f: r => esc(r.jenis_kamar) },
      { h: 'Masuk – Keluar', f: r => `${esc(r.tanggal_masuk)}<br><span class="mute small">${esc(r.tanggal_keluar || 's/d belum ditentukan')}</span>` },
      { h: 'Status', f: r => badge(r.status) },
      { h: 'Aksi', cls: 'act', f: r => can('booking.write') ? `
        ${r.status === 'menunggu' ? `<button class="btn sm" data-a="ok" data-id="${r.id}">Konfirmasi</button> ` : ''}
        ${r.status !== 'dibatalkan' ? `<button class="btn sm" data-a="cancel" data-id="${r.id}">Batalkan</button> ` : ''}
        <button class="btn sm" data-a="edit" data-id="${r.id}">Ubah</button>
        ${can('booking.delete') ? ` <button class="btn sm danger" data-a="del" data-id="${r.id}">Hapus</button>` : ''}` : '' }
    ], d.items, 'Tidak ada booking yang cocok.')}
    ${pager(st, d.total)}`;
    bindPager(el, st, reload);
    let t; $('#q', el).oninput = e => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value.trim(); st.offset = 0; reload(); }, 350); };
    $('#fs', el).onchange = e => { st.status = e.target.value; st.offset = 0; reload(); };
    $('#frs', el).onchange = e => { const m = e.target.value.match(/rs-\d+/i); st.kode_rs = m ? m[0].toLowerCase() : e.target.value.trim(); st.offset = 0; reload(); };
    const byId = id => d.items.find(x => x.id === Number(id));
    const formFields = (r = {}) => [
      { name: 'kode_rs', label: 'Rumah sakit (rs_id)', type: 'rs', required: true, value: r.kode_rs, wide: true },
      { name: 'nama_pasien', label: 'Nama pasien', required: true, value: r.nama_pasien },
      { name: 'no_telp', label: 'No. telepon', required: true, value: r.no_telp },
      { name: 'jenis_kamar', label: 'Jenis kamar', type: 'select', options: ROOMS, value: r.jenis_kamar || 'Kelas III' },
      { name: 'status', label: 'Status', type: 'select', options: ['menunggu', 'dikonfirmasi', 'dibatalkan'], value: r.status || 'menunggu' },
      { name: 'tanggal_masuk', label: 'Tanggal masuk', type: 'date', required: true, value: r.tanggal_masuk },
      { name: 'tanggal_keluar', label: 'Tanggal keluar (opsional)', type: 'date', nullable: true, value: r.tanggal_keluar },
      { name: 'catatan', label: 'Catatan', type: 'textarea', wide: true, nullable: true, value: r.catatan }];
    const ad = $('#add', el); if (ad) ad.onclick = () => openForm({ title: 'Tambah booking', note: 'Kuota kamar dicek atomik oleh stored procedure sp_buat_booking.', fields: formFields(), onSubmit: async v => { await api('/bookings', { method: 'POST', body: v }); toast('Booking dibuat', 'ok'); reload(); } });
    el.onclick = e => {
      const b = e.target.closest('[data-a]'); if (!b) return; const id = b.dataset.id, r = byId(id);
      if (b.dataset.a === 'edit') openForm({ title: 'Ubah booking ' + r.kode_booking, fields: formFields(r), onSubmit: async v => { await api('/bookings/' + id, { method: 'PUT', body: v }); toast('Booking diperbarui', 'ok'); reload(); } });
      if (b.dataset.a === 'ok') confirmAct('Konfirmasi booking ini?', async () => { await api('/bookings/' + id, { method: 'PUT', body: { status: 'dikonfirmasi' } }); toast('Dikonfirmasi', 'ok'); reload(); });
      if (b.dataset.a === 'cancel') confirmAct('Batalkan booking ini? Pembatalan tidak dapat diaktifkan kembali.', async () => { await api('/bookings/' + id, { method: 'PUT', body: { status: 'dibatalkan' } }); toast('Dibatalkan', 'ok'); reload(); });
      if (b.dataset.a === 'del') confirmAct('Hapus PERMANEN booking ' + r.kode_booking + '?', async () => { await api('/bookings/' + id, { method: 'DELETE' }); toast('Dihapus', 'ok'); reload(); });
    };
  } },

  kuota: { label: 'Kuota Kamar', perm: 'kuota.read', async render(el) {
    const d = await api('/kuota'), reload = () => this.render(el);
    el.innerHTML = `<div class="head"><h1>Kuota Kamar per RS</h1>${can('kuota.write') ? '<button class="btn primary" id="add">+ Atur kuota</button>' : ''}</div>
    <p class="mute small">RS/jenis kamar yang belum diatur memakai kapasitas default <b>${d.default_kapasitas}</b>. Okupansi dihitung view <code>v_okupansi_kamar</code>.</p>
    ${table([{ h: 'RS', f: r => rsLabel(r.rs_id, r.nama_rs) }, { h: 'Kamar', f: r => esc(r.jenis_kamar) }, { h: 'Kapasitas', f: r => r.kapasitas },
      { h: 'Terisi hari ini', f: r => r.terisi_hari_ini }, { h: 'Sisa', f: r => `<b style="color:${r.sisa_hari_ini ? 'var(--ok)' : 'var(--bad)'}">${r.sisa_hari_ini}</b>` },

/* ---------- Shell ---------- */
async function show(id) {
  const v = VIEWS[id]; if (!v || !can(v.perm)) return;
  S.view = id; renderNav();
  const el = $('#view'); el.innerHTML = '<p class="mute">Memuat…</p>';
  try { await v.render(el); } catch (e) { el.innerHTML = `<div class="panel"><b>Gagal memuat.</b><p class="mute">${esc(e.message)}</p></div>`; }
}
function renderNav() {
  $('#nav').innerHTML = Object.entries(VIEWS).filter(([, v]) => can(v.perm)).map(([id, v]) => `<button data-v="${id}" class="${S.view === id ? 'on' : ''}">${esc(v.label)}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.v));
}
async function enter() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who-name').textContent = S.me.nama_lengkap; $('#who-role').textContent = S.me.role_kode + ' · ' + S.me.username;
  try { S.rs = await api('/hospitals'); S.rsMap = Object.fromEntries(S.rs.map(h => [h.id, h.nama])); } catch (e) { toast('Daftar RS gagal dimuat: ' + e.message, 'err'); }
  show(S.view in VIEWS && can(VIEWS[S.view].perm) ? S.view : 'dashboard');
}
function doLogout(expired) {
  if (S.token && !expired) api('/logout', { method: 'POST' }).catch(() => {});
  S.token = null; S.me = null; localStorage.removeItem(TOKEN_KEY);
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); closeModal();
  if (expired) $('#login-err').textContent = 'Sesi berakhir, silakan login kembali.';
}
$('#logout').onclick = () => doLogout(false);
$('#login-form').onsubmit = async e => {
  e.preventDefault(); $('#login-err').textContent = ''; $('#login-btn').disabled = true;
  try {
    const r = await api('/login', { method: 'POST', body: { username: $('#lu').value.trim(), password: $('#lp').value } });
    S.token = r.token; S.me = r.user; localStorage.setItem(TOKEN_KEY, r.token); $('#lp').value = ''; await enter();
  } catch (err) { $('#login-err').textContent = err.message; } finally { $('#login-btn').disabled = false; }
};
(async () => { if (!S.token) return; try { S.me = await api('/me'); await enter(); } catch (e) { doLogout(false); } })();
</script>
