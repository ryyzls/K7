<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CariSehat — Panel Operasional</title>
<style>
:root{
  --ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--bg:#f8fafc;--card:#fff;
  --brand:#0b2a52;--brand-2:#123d73;--blue:#0057b8;--ok:#059669;--warn:#d97706;--bad:#e11d48
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:1.25rem;background:linear-gradient(180deg,#f1f5f9 0%,#e2e8f0 100%)}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:2rem;width:100%;max-width:400px;box-shadow:0 16px 36px rgba(15,23,42,.08)}
.brand-pill{display:inline-flex;align-items:center;gap:.45rem;font-size:12px;font-weight:700;color:var(--brand);background:#eff6ff;border:1px solid #dbeafe;padding:.25rem .65rem;border-radius:99px;margin-bottom:.75rem}
.login-card h1{margin:0 0 .3rem;font-size:1.35rem;letter-spacing:-.02em;color:var(--brand)}
.login-card p{margin:0 0 1.25rem;color:var(--mute);font-size:13px}
label{display:block;font-size:12px;font-weight:600;color:#334155;margin:.75rem 0 .25rem}
input,select,textarea{width:100%;padding:.55rem .75rem;border:1px solid #cbd5e1;border-radius:10px;background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,87,184,.12)}

/* Buttons */
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.48rem .85rem;cursor:pointer;font-weight:600;font-size:13px;color:#334155;transition:background .15s,border-color .15s}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-2)}
.btn.danger{color:var(--bad);border-color:#fecdd3}
.btn.danger:hover{background:#fff1f2}
.btn.sm{padding:.28rem .6rem;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}

/* Layout */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--brand);color:#cbd5e1;padding:1.15rem .85rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.aside-brand{display:flex;align-items:center;gap:.6rem;padding:.2rem .5rem 1rem;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:.85rem}
.aside-logo{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
aside h2{color:#fff;margin:0;font-size:1rem;letter-spacing:-.01em}
aside .sub{display:block;font-size:11px;color:#93c5fd;font-weight:500}
aside nav{flex:1;overflow:auto;display:flex;flex-direction:column;gap:.2rem}
aside nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cbd5e1;padding:.58rem .8rem;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;transition:background .15s,color .15s}
aside nav button:hover{background:rgba(255,255,255,.08);color:#fff}
aside nav button.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.who{border-top:1px solid rgba(255,255,255,.12);padding:.85rem .5rem 0;font-size:12px}
.who b{color:#fff;display:block}
.who-actions{display:flex;align-items:center;justify-content:space-between;margin-top:.6rem}
main{padding:1.6rem 1.8rem;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:1.1rem}
.head h1{margin:0;font-size:1.35rem;letter-spacing:-.02em;color:var(--ink)}

/* Cards & Panels */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:.85rem;margin-bottom:1.1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem}
.stat span{display:block;color:var(--mute);font-size:12px;font-weight:600}
.stat b{display:block;margin-top:.25rem;font-size:1.65rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem;margin-bottom:1rem}
.panel h3{margin:0 0 .8rem;font-size:.95rem;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem}
.filters{display:flex;gap:.55rem;flex-wrap:wrap;margin-bottom:.9rem}
.filters>*{width:auto;min-width:170px}

/* Table */
.tablewrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%}
th,td{padding:.62rem .8rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f8fafc;font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fcfdfe}
td.act{white-space:nowrap}

/* Badges & Bars */
.badge{display:inline-block;padding:.15rem .55rem;border-radius:99px;font-size:11px;font-weight:700;background:#e2e8f0;color:#334155}
.b-menunggu{background:#fef3c7;color:#92400e}
.b-dikonfirmasi,.b-selesai,.b-ok{background:#d1fae5;color:#065f46}
.b-dibatalkan,.b-off{background:#ffe4e6;color:#9f1239}
.mute{color:var(--mute)}
.small{font-size:12px}
.bar{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin-top:.3rem;margin-bottom:.65rem}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.pager{display:flex;align-items:center;gap:.5rem;justify-content:flex-end;margin-top:.8rem}

/* Modal & Toast */
#overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;place-items:center;padding:1rem;z-index:50}
#overlay.on{display:grid}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:1.4rem;box-shadow:0 20px 45px rgba(15,23,42,.2)}
.modal h3{margin:0 0 .4rem;font-size:1.1rem}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.modal .foot{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.1rem}
#toast{position:fixed;right:1rem;bottom:1rem;display:grid;gap:.5rem;z-index:60}
.t{background:var(--ink);color:#fff;padding:.65rem .95rem;border-radius:10px;max-width:360px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.t.err{background:var(--bad)}
.t.ok{background:var(--ok)}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font-size:11px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:.5rem;max-height:220px;overflow:auto}
.err-msg{color:var(--bad);font-size:13px;margin-top:.6rem;min-height:1.2em}

@media(max-width:820px){
  #app{grid-template-columns:1fr}
  aside{position:static;height:auto}
  aside nav{flex-direction:row;flex-wrap:wrap;gap:.3rem}
  aside nav button{width:auto}
  main{padding:1.1rem}
}

/* Visual Diff & Grafik Tren */
.diff-list{display:flex;flex-direction:column;gap:.35rem;margin:.35rem 0}
.diff-item{font-size:12px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:.35rem .55rem;line-height:1.4}
.diff-key{font-weight:700;color:var(--brand);margin-right:.35rem}
.diff-old{background:#ffe4e6;color:#9f1239;padding:1px 5px;border-radius:4px;text-decoration:line-through}
.diff-new{background:#d1fae5;color:#065f46;padding:1px 5px;border-radius:4px;font-weight:600}
.trend-wrap{display:grid;grid-template-columns:repeat(7,1fr);gap:.65rem;align-items:end;height:145px;padding-top:1rem}
.trend-col{display:flex;flex-direction:column;align-items:center;gap:.3rem;height:100%;justify-content:flex-end}
.trend-pair{display:flex;align-items:flex-end;gap:4px;height:96px;width:100%;justify-content:center}
.trend-bar-b{width:12px;background:var(--brand);border-radius:4px 4px 0 0;min-height:3px;transition:height .2s}
.trend-bar-p{width:12px;background:#0d9488;border-radius:4px 4px 0 0;min-height:3px;transition:height .2s}
.trend-lbl{font-size:11px;color:var(--mute);white-space:nowrap}

.stepper{display:inline-flex;align-items:center;gap:.35rem}
.step-btn{width:26px;height:26px;border-radius:7px;border:1px solid #cbd5e1;background:#fff;font-weight:700;cursor:pointer;display:inline-grid;place-items:center;line-height:1}
.step-btn:hover{background:#f1f5f9;border-color:var(--brand)}
.igd-normal{background:#d1fae5;color:#065f46}
.igd-siaga{background:#fef3c7;color:#92400e}
.igd-penuh{background:#ffe4e6;color:#9f1239}
.alert-bar{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:.75rem 1rem;margin-bottom:1rem;font-size:13px}
</style>
</head>
<body>

<section id="login">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="brand-pill">+ CariSehat Sumatera Utara</div>
    <h1>Panel Operasional</h1>
    <p>Masuk untuk mengelola pemesanan kamar, kuota fasilitas, jadwal dokter, dan layanan pasien.</p>
    <label for="lu">Nama Pengguna</label>
    <input id="lu" name="username" autocomplete="username" required>
    <label for="lp">Kata Sandi</label>
    <input id="lp" name="password" type="password" autocomplete="current-password" required>
    <div class="err-msg" id="login-err" role="alert"></div>
    <button class="btn primary" style="width:100%;margin-top:.5rem;padding:.6rem" id="login-btn">Masuk ke Panel</button>
    <p class="small mute" style="margin-top:1rem">Akses khusus staf dan operator terotorisasi. Hubungi administrator jika membutuhkan pengaturan ulang akun.</p>
  </form>
</section>

<div id="app" class="hidden">
  <aside>
    <div class="aside-brand">
      <div class="aside-logo">+</div>
      <div>
        <h2>CariSehat</h2>
        <span class="sub">Panel Operasional</span>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="who">
      <b id="who-name"></b>
      <span id="who-role" class="mute"></span>
      <div class="who-actions">
        <button class="btn sm" id="logout">Keluar</button>
        <a class="small" href="/" style="color:#93c5fd;text-decoration:none;font-weight:600">Lihat Portal →</a>
      </div>
    </div>
  </aside>
  <main id="view"></main>
</div>

<div id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" aria-live="polite"></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOKEN_KEY = 'cs_admin_token';
const S = { token: localStorage.getItem(TOKEN_KEY), me: null, rs: [], rsMap: {}, view: 'dashboard' };
const ROOMS = ['VIP', 'Kelas I', 'Kelas II', 'Kelas III', 'ICU'];
const HARI = ['', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 't ' + kind;
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

async function api(path, opt = {}) {
  const headers = { Accept: 'application/json', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) };
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  const res = await fetch('/api/admin' + path, {
    ...opt,
    headers,
    body: opt.body ? JSON.stringify(opt.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 401 && S.token && path !== '/login') { doLogout(true); }
    let d = data && data.detail;
    if (Array.isArray(d)) d = d.map(x => (x.loc || []).slice(1).join('.') + ': ' + x.msg).join('; ');
    throw new Error(d || ('HTTP ' + res.status));
  }
  return data;
}

const can = p => S.me && S.me.permissions.includes(p);
const qs = o => new URLSearchParams(Object.entries(o).filter(([, v]) => v !== '' && v != null)).toString();
const fmtDT = v => v ? new Date(v).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
const badge = s => `<span class="badge b-${esc(s)}">${esc(s)}</span>`;
function renderAuditDiff(oldObj, newObj) {
  if (!oldObj && !newObj) return '<span class="mute small">-</span>';
  if (!oldObj && newObj) {
    return `<div class="diff-item"><span class="diff-key">Entri Baru</span><span class="diff-new">${esc(newObj.kode_booking || newObj.kode_reservasi || newObj.username || newObj.nama_poli || ('ID ' + (newObj.id ?? '')))}</span></div>`;
  }
  if (oldObj && !newObj) {
    return `<div class="diff-item"><span class="diff-key">Data Dihapus</span><span class="diff-old">${esc(oldObj.kode_booking || oldObj.kode_reservasi || oldObj.username || oldObj.nama_poli || ('ID ' + (oldObj.id ?? '')))}</span></div>`;
  }
  const keys = Array.from(new Set([...Object.keys(oldObj), ...Object.keys(newObj)])).filter(k => k !== 'updated_at');
  const diffs = keys.filter(k => JSON.stringify(oldObj[k]) !== JSON.stringify(newObj[k]));
  if (!diffs.length) return '<span class="mute small">Tidak ada perubahan nilai</span>';
  return `<div class="diff-list">${diffs.map(k => {
    const vOld = oldObj[k] == null ? 'null' : String(oldObj[k]);
    const vNew = newObj[k] == null ? 'null' : String(newObj[k]);
    return `<div class="diff-item"><span class="diff-key">${esc(k)}:</span> <span class="diff-old">${esc(vOld)}</span> ? <span class="diff-new">${esc(vNew)}</span></div>`;
  }).join('')}</div>`;
}
const rsLabel = (id, name) => `<b>${esc(name || S.rsMap[id] || id)}</b><br><span class="mute small">${esc(id)}</span>`;

/* ---------- Modal & form ---------- */
function closeModal() { $('#overlay').classList.remove('on'); $('#modal').innerHTML = ''; }
$('#overlay').addEventListener('mousedown', e => { if (e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function field(f) {
  const v = f.value ?? '', id = 'f_' + f.name, req = f.required ? 'required' : '';
  let input;
  if (f.type === 'select') {
    input = `<select id="${id}" ${req}>${f.options.map(o => {
      const [val, lab] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`;
    }).join('')}</select>`;
  } else if (f.type === 'rs') {
    input = `<input id="${id}" list="rslist" value="${esc(v)}" placeholder="Ketik kode atau nama rumah sakit" ${req}>`;
  } else if (f.type === 'textarea') {
    input = `<textarea id="${id}" rows="3" ${req}>${esc(v)}</textarea>`;
  } else if (f.type === 'checkbox') {
    input = `<label style="display:flex;gap:.5rem;align-items:center;font-weight:500"><input style="width:auto" type="checkbox" id="${id}" ${v ? 'checked' : ''}> ${esc(f.hint || 'Aktif')}</label>`;
  } else {
    input = `<input id="${id}" type="${f.type || 'text'}" value="${esc(v)}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.minlength ? `minlength="${f.minlength}"` : ''} ${req} ${f.autocomplete ? `autocomplete="${f.autocomplete}"` : ''}>`;
  }
  return `<div style="${f.wide ? 'grid-column:1/-1' : ''}">${f.type === 'checkbox' ? '' : `<label for="${id}">${esc(f.label)}</label>`}${input}</div>`;
}

function openForm({ title, fields, submitText = 'Simpan', onSubmit, note }) {
  const dl = `<datalist id="rslist">${S.rs.map(h => `<option value="${esc(h.id)}">${esc(h.nama)}</option>`).join('')}</datalist>`;
  $('#modal').innerHTML = `<form id="mform"><h3>${esc(title)}</h3>${note ? `<p class="mute small">${esc(note)}</p>` : ''}${dl}
    <div class="row">${fields.map(field).join('')}</div><div class="err-msg" id="merr" role="alert"></div>
    <div class="foot"><button type="button" class="btn" id="mcancel">Batal</button><button class="btn primary" id="msave">${esc(submitText)}</button></div></form>`;
  $('#overlay').classList.add('on');
  $('#mcancel').onclick = closeModal;
  const first = $('#mform input,#mform select,#mform textarea');
  if (first) first.focus();
  $('#mform').onsubmit = async e => {
    e.preventDefault();
    const vals = {};
    for (const f of fields) {
      const el = $('#f_' + f.name);
      let x = f.type === 'checkbox' ? el.checked : el.value.trim();
      if (f.type === 'rs') {
        const m = x.match(/rs-\d+/i);
        x = m ? m[0].toLowerCase() : x;
      }
      if (f.type === 'number') x = x === '' ? null : Number(x);
      if (f.nullable && x === '') x = null;
      vals[f.name] = x;
    }
    $('#msave').disabled = true;
    try {
      await onSubmit(vals);
      closeModal();
    } catch (err) {
      $('#merr').textContent = err.message;
      $('#msave').disabled = false;
    }
  };
}

async function confirmAct(msg, fn) {
  if (!confirm(msg)) return;
  try { await fn(); } catch (e) { toast(e.message, 'err'); }
}

/* ---------- Tabel generik ---------- */
function table(cols, rows, empty = 'Belum ada data.') {
  if (!rows || !rows.length) return `<div class="panel mute">${esc(empty)}</div>`;
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.cls || ''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function pager(st, total) {
  const from = total ? st.offset + 1 : 0, to = Math.min(st.offset + st.limit, total);
  return `<div class="pager"><span class="mute small">${from}–${to} dari ${total}</span>
    <button class="btn sm" data-pg="-1" ${st.offset <= 0 ? 'disabled' : ''}>‹ Sebelumnya</button>
    <button class="btn sm" data-pg="1" ${st.offset + st.limit >= total ? 'disabled' : ''}>Berikutnya ›</button></div>`;
}

function bindPager(root, st, reload) {
  root.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => {
    st.offset = Math.max(0, st.offset + Number(b.dataset.pg) * st.limit);
    reload();
  });
}

/* ---------- Views ---------- */
const VIEWS = {
  dashboard: {
    label: 'Ringkasan Operasional',
    perm: 'dashboard.view',
    async render(el) {
      const d = await api('/dashboard');
      const s = d.stats || {};
      const byJenis = d.by_jenis || [];
      const max = Math.max(1, ...byJenis.map(x => x.total));
      const trend = d.trend_harian || [];
      const maxTrend = Math.max(1, ...trend.flatMap(x => [Number(x.booking || 0), Number(x.poli || 0)]));
      el.innerHTML = `<div class="head"><h1>Ringkasan Operasional</h1><div style="display:flex;gap:.5rem"><button class="btn" id="exp-csv">Ekspor Laporan CSV</button><button class="btn" id="r">Muat Ulang</button></div></div>
      <div class="cards">
        <div class="stat"><span>Rumah Sakit Terdaftar</span><b>${d.total_rs_rdf ?? '-'}</b></div>
        <div class="stat"><span>Total Booking Kamar</span><b>${s.total_booking ?? 0}</b></div>
        <div class="stat"><span>Menunggu Konfirmasi</span><b style="color:var(--warn)">${s.booking_menunggu ?? 0}</b></div>
        <div class="stat"><span>Dikonfirmasi</span><b style="color:var(--ok)">${s.booking_dikonfirmasi ?? 0}</b></div>
        <div class="stat"><span>Dibatalkan</span><b style="color:var(--bad)">${s.booking_dibatalkan ?? 0}</b></div>
        <div class="stat"><span>Booking Hari Ini</span><b>${s.booking_hari_ini ?? 0}</b></div>
        <div class="stat"><span>Jadwal Dokter Aktif</span><b>${s.jadwal_aktif ?? 0}</b></div>
        <div class="stat"><span>Reservasi Poli Aktif</span><b>${s.reservasi_aktif ?? 0}</b></div>
      </div>
      <div class="grid2">
        <div class="panel"><h3>Booking Aktif per Kelas Kamar</h3>${byJenis.map(x => `<div class="small"><b>${esc(x.jenis_kamar)}</b> — ${x.total} pesanan<div class="bar"><i style="width:${x.total / max * 100}%"></i></div></div>`).join('') || '<span class="mute small">Belum ada pemesanan aktif.</span>'}</div>
        <div class="panel"><h3>Rumah Sakit dengan Permintaan Tertinggi</h3>${table([{ h: 'Rumah Sakit', f: r => rsLabel(r.rs_id, r.nama_rs) }, { h: 'Total', f: r => r.total }, { h: 'Menunggu', f: r => r.menunggu }], d.top_rs, 'Belum ada data pemesanan.')}</div>
        <div class="panel"><h3>Booking Kamar Terbaru</h3>${table([{ h: 'Kode', f: r => esc(r.kode_booking) }, { h: 'Pasien', f: r => esc(r.nama_pasien) }, { h: 'Rumah Sakit', f: r => esc(r.nama_rs) }, { h: 'Status', f: r => badge(r.status) }], d.recent_booking, 'Belum ada booking terbaru.')}</div>
        <div class="panel"><h3>Ketersediaan Kamar Terbatas Hari Ini</h3>${table([{ h: 'Rumah Sakit', f: r => rsLabel(r.rs_id, r.nama_rs) }, { h: 'Kelas Kamar', f: r => esc(r.jenis_kamar) }, { h: 'Sisa / Kapasitas', f: r => `${r.sisa_hari_ini} / ${r.kapasitas}` }], d.okupansi, 'Belum ada konfigurasi kuota khusus.')}</div>
      </div>
      <div class="panel" style="margin-top:1rem">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem">
          <h3 style="margin:0">Tren Reservasi 7 Hari Terakhir</h3>
          <div class="small mute"><span style="display:inline-block;width:10px;height:10px;background:var(--brand);border-radius:2px;margin-right:4px"></span>Booking Kamar &nbsp;&nbsp;<span style="display:inline-block;width:10px;height:10px;background:#0d9488;border-radius:2px;margin-right:4px"></span>Antrean Poliklinik</div>
        </div>
        <div class="trend-wrap">
          ${trend.map(t => {
            const b = Number(t.booking || 0), p = Number(t.poli || 0);
            const hB = Math.round((b / maxTrend) * 86);
            const hP = Math.round((p / maxTrend) * 86);
            const lbl = (t.tanggal || '').slice(5);
            return `<div class="trend-col" title="${esc(t.tanggal)}: ${b} booking kamar, ${p} antrean poli">
              <div class="small" style="font-size:11px;font-weight:600">${b}/${p}</div>
              <div class="trend-pair"><div class="trend-bar-b" style="height:${Math.max(4, hB)}px"></div><div class="trend-bar-p" style="height:${Math.max(4, hP)}px"></div></div>
              <div class="trend-lbl">${esc(lbl)}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
      $('#r', el).onclick = () => show('dashboard');
      $('#exp-csv', el).onclick = async () => {
        try {
          const res = await fetch('/api/admin/dashboard/export.csv', {
            headers: S.token ? { Authorization: 'Bearer ' + S.token } : {},
          });
          if (!res.ok) throw new Error('Gagal mengunduh CSV (HTTP ' + res.status + ')');
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'laporan_operasional_carisehat.csv';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          toast('Laporan CSV berhasil diunduh', 'ok');
        } catch (err) {
          toast(err.message, 'bad');
        }
      };
    },
  },

        <input id="frs" list="rslist2" placeholder="Filter rumah sakit" value="${esc(st.kode_rs)}"><datalist id="rslist2">${S.rs.map(h => `<option value="${esc(h.id)}">${esc(h.nama)}</option>`).join('')}</datalist></div>

      $('#frs', el).onchange = e => { const m = e.target.value.match(/rs-\d+/i); st.kode_rs = m ? m[0].toLowerCase() : e.target.value.trim(); st.offset = 0; reload(); };

        { name: 'no_telp', label: 'No. Telepon', required: true, value: r.no_telp },

        { name: 'tanggal_masuk', label: 'Tanggal Masuk', type: 'date', required: true, value: r.tanggal_masuk },

        if (b.dataset.a === 'ok') confirmAct('Konfirmasi booking kamar ini?', async () => { await api('/bookings/' + id, { method: 'PUT', body: { status: 'dikonfirmasi' } }); toast('Booking dikonfirmasi', 'ok'); reload(); });
        if (b.dataset.a === 'cancel') confirmAct('Batalkan booking ini? Pembatalan tidak dapat diaktifkan kembali.', async () => { await api('/bookings/' + id, { method: 'PUT', body: { status: 'dibatalkan' } }); toast('Booking dibatalkan', 'ok'); reload(); });
        if (b.dataset.a === 'del') confirmAct('Hapus permanen booking ' + r.kode_booking + '?', async () => { await api('/bookings/' + id, { method: 'DELETE' }); toast('Booking dihapus', 'ok'); reload(); });

  kuota: {
    label: 'Kuota Kamar',
    perm: 'kuota.read',
    async render(el) {
      const [d, igd] = await Promise.all([api('/kuota'), api('/igd-status').catch(() => ({ items: [] }))]);
      const reload = () => this.render(el);
      const items = d.items || [];
      const igdItems = igd.items || [];
      const highOcc = items.filter(r => Number(r.kapasitas) > 0 && (Number(r.terisi_hari_ini) / Number(r.kapasitas)) >= 0.85);

      el.innerHTML = `<div class="head"><h1>Kuota Kamar & Kontrol Darurat IGD</h1><div style="display:flex;gap:.5rem">${can('kuota.write') ? '<button class="btn" id="add-igd">+ Status IGD RS</button><button class="btn primary" id="add">+ Atur Kuota Kamar</button>' : ''}</div></div>
      <p class="mute small">Gunakan tombol <b>- / +</b> untuk memperbarui jumlah bed secara langsung. Unit tanpa pengaturan khusus memakai kapasitas standar <b>${d.default_kapasitas}</b> kamar.</p>
      ${highOcc.length ? `<div class="alert-bar"><b>Peringatan Kapasitas Kritis (Okupansi ? 85%):</b> ${highOcc.map(x => `${esc(x.nama_rs || x.rs_id)} (${esc(x.jenis_kamar)}: ${x.terisi_hari_ini}/${x.kapasitas})`).join(' ? ')}</div>` : ''}

      <div class="panel" style="margin-bottom:1rem">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
          <h3 style="margin:0">Status Siaga IGD Rumah Sakit (Sinkron Radar Darurat)</h3>
          <span class="mute small">${igdItems.length} RS dikonfigurasi</span>
        </div>
        ${table([
          { h: 'Rumah Sakit', f: r => rsLabel(r.rs_id, r.nama_rs) },
          { h: 'Status IGD', f: r => `<span class="badge igd-${esc(r.status_igd)}">${esc((r.status_igd || 'normal').toUpperCase())}</span>` },
          { h: 'Catatan Operasional', f: r => esc(r.catatan || '-') },
          { h: 'Diperbarui', f: r => `${esc(r.updated_by || '-')} ? ${fmtDT(r.updated_at)}` },
          { h: 'Ubah Cepat', cls: 'act', f: r => can('kuota.write') ? ['normal', 'siaga', 'penuh'].map(st => `<button class="btn sm" data-igd="${esc(r.rs_id)}|${st}" ${r.status_igd === st ? 'disabled' : ''}>${st.toUpperCase()}</button>`).join(' ') : '' }
        ], igdItems, 'Seluruh rumah sakit IGD berstatus NORMAL. Klik "+ Status IGD RS" untuk mengatur status siaga.')}
      </div>

      ${table([
        { h: 'Rumah Sakit', f: r => rsLabel(r.rs_id, r.nama_rs) },
        { h: 'Kelas Kamar', f: r => esc(r.jenis_kamar) },
        { h: 'Kapasitas (Quick-Stepper)', f: r => can('kuota.write')
          ? `<div class="stepper"><button class="step-btn" data-step="${esc(r.rs_id)}|${esc(r.jenis_kamar)}|-1" title="Kurangi 1 bed">?</button><b style="min-width:26px;text-align:center">${r.kapasitas}</b><button class="step-btn" data-step="${esc(r.rs_id)}|${esc(r.jenis_kamar)}|1" title="Tambah 1 bed">+</button></div>`
          : r.kapasitas },
        { h: 'Terisi & Okupansi', f: r => {
          const cap = Number(r.kapasitas) || 0;
          const used = Number(r.terisi_hari_ini) || 0;
          const pct = cap > 0 ? Math.min(100, Math.round((used / cap) * 100)) : 100;
          const col = pct >= 85 ? 'var(--bad)' : pct >= 65 ? 'var(--warn)' : 'var(--ok)';
          return `<div><b>${used}</b> / ${cap} <span class="small" style="color:${col};font-weight:700">(${pct}%)</span></div><div class="bar"><i style="width:${pct}%;background:${col}"></i></div>`;
        }},
        { h: 'Sisa Bed', f: r => `<b style="color:${r.sisa_hari_ini ? 'var(--ok)' : 'var(--bad)'}">${r.sisa_hari_ini}</b>` },
        { h: 'Aksi', cls: 'act', f: r => can('kuota.write') ? `<button class="btn sm" data-a="edit" data-i="${esc(r.rs_id)}|${esc(r.jenis_kamar)}|${r.kapasitas}">Ubah</button> <button class="btn sm danger" data-a="del" data-i="${esc(r.rs_id)}|${esc(r.jenis_kamar)}">Hapus</button>` : '' }
      ], items, 'Belum ada pengaturan kuota khusus; seluruh rumah sakit memakai kapasitas standar.')}`;

      const fields = (r = {}) => [
        { name: 'rs_id', label: 'Rumah Sakit', type: 'rs', required: true, value: r.rs_id, wide: true },
        { name: 'jenis_kamar', label: 'Kelas Kamar', type: 'select', options: ROOMS, value: r.jenis_kamar || 'Kelas III' },
        { name: 'kapasitas', label: 'Kapasitas (Jumlah Kamar)', type: 'number', min: 0, max: 1000, required: true, value: r.kapasitas ?? 5 }];
      const save = async v => { await api('/kuota', { method: 'POST', body: v }); toast('Kuota kamar disimpan', 'ok'); reload(); };

      const ad = $('#add', el);
      if (ad) ad.onclick = () => openForm({ title: 'Atur Kuota Kamar', fields: fields(), onSubmit: save });

      const adIgd = $('#add-igd', el);
      if (adIgd) adIgd.onclick = () => openForm({
        title: 'Atur Status Operasional IGD',
        fields: [
          { name: 'rs_id', label: 'Rumah Sakit', type: 'rs', required: true, wide: true },
          { name: 'status_igd', label: 'Status IGD', type: 'select', options: ['normal', 'siaga', 'penuh'], value: 'siaga' },
          { name: 'catatan', label: 'Catatan (opsional)', placeholder: 'Misal: Ruang resusitasi penuh, rujuk ICU tersedia' },
        ],
        onSubmit: async v => { await api('/igd-status', { method: 'POST', body: v }); toast('Status IGD diperbarui', 'ok'); reload(); },
      });

      el.onclick = async e => {
        const stepBtn = e.target.closest('[data-step]');
        if (stepBtn) {
          const [rs_id, jenis_kamar, deltaStr] = stepBtn.dataset.step.split('|');
          stepBtn.disabled = true;
          try {
            const res = await api('/kuota/step', { method: 'PATCH', body: { rs_id, jenis_kamar, delta: Number(deltaStr) } });
            toast(res.message || 'Kapasitas diperbarui', 'ok');
            reload();
          } catch (err) {
            toast(err.message, 'bad');
            stepBtn.disabled = false;
          }
          return;
        }

        const igdBtn = e.target.closest('[data-igd]');
        if (igdBtn) {
          const [rs_id, status_igd] = igdBtn.dataset.igd.split('|');
          igdBtn.disabled = true;
          try {
            const res = await api('/igd-status', { method: 'POST', body: { rs_id, status_igd, catatan: '' } });
            toast(res.message || 'Status IGD diperbarui', 'ok');
            reload();
          } catch (err) {
            toast(err.message, 'bad');
            igdBtn.disabled = false;
          }
          return;
        }

        const b = e.target.closest('[data-a]');
        if (!b) return;
        const [rs, j, k] = b.dataset.i.split('|');
        if (b.dataset.a === 'edit') openForm({ title: 'Ubah Kuota Kamar', fields: fields({ rs_id: rs, jenis_kamar: j, kapasitas: k }), onSubmit: save });
        else confirmAct(`Kembalikan kuota ${j} pada ${rs} ke kapasitas standar (${d.default_kapasitas})?`, async () => {
          await api(`/kuota/${encodeURIComponent(rs)}/${encodeURIComponent(j)}`, { method: 'DELETE' });
          toast('Kuota dihapus', 'ok');
          reload();
        });
      };
    },
  },

          ${r.status === 'menunggu' ? `<button class="btn sm primary" data-qst="${r.id}|dikonfirmasi">Check-in</button> ` : ''}
          ${r.status === 'dikonfirmasi' ? `<button class="btn sm" data-qst="${r.id}|selesai" style="border-color:var(--ok);color:var(--ok)">Selesai</button> ` : ''}
          <select data-st="${r.id}" style="width:auto">${['menunggu', 'dikonfirmasi', 'selesai', 'dibatalkan'].map(x => `<option ${x === r.status ? 'selected' : ''}>${x}</option>`).join('')}</select>
          <button class="btn sm danger" data-del="${r.id}">Hapus</button>` : '' }
      ], items, 'Belum ada reservasi poliklinik.')}
      ${pager(st, d.total)}`;
      bindPager(el, st, reload);
      let t;
      $('#q', el).oninput = e => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value.trim(); st.offset = 0; reload(); }, 350); };
      $('#fs', el).onchange = e => { st.status = e.target.value; st.offset = 0; reload(); };
      $('#rtoday', el).onclick = () => { st.todayOnly = !st.todayOnly; reload(); };

      const closeExp = $('#close-exp', el);
      if (closeExp) closeExp.onclick = () => confirmAct('Tutup otomatis seluruh antrean poliklinik yang telah melewati tanggal kunjungan?', async () => {
        const res = await api('/reservasi/tutup-kedaluwarsa', { method: 'POST' });
        toast(res.message || 'Antrean kedaluwarsa berhasil ditutup', 'ok');
        reload();
      });

      el.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
        navigator.clipboard?.writeText(b.dataset.copy);
        toast('Kode tiket ' + b.dataset.copy + ' disalin', 'ok');
      });

      el.querySelectorAll('[data-qst]').forEach(b => b.onclick = async () => {
        const [rid, nextStatus] = b.dataset.qst.split('|');
        b.disabled = true;
        try {
          await api('/reservasi/' + rid, { method: 'PUT', body: { status: nextStatus } });
          toast(`Tiket berhasil diubah ke ${nextStatus.toUpperCase()}`, 'ok');
          reload();
        } catch (err) { toast(err.message, 'bad'); b.disabled = false; }
      });

      el.querySelectorAll('[data-st]').forEach(s => s.onchange = async () => {
        try {
          await api('/reservasi/' + s.dataset.st, { method: 'PUT', body: { status: s.value } });
          toast('Status reservasi diperbarui', 'ok');
          reload();
        } catch (e) { toast(e.message, 'bad'); reload(); }
      });
      el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirmAct('Hapus reservasi ini?', async () => {
        await api('/reservasi/' + b.dataset.del, { method: 'DELETE' });
        toast('Reservasi dihapus', 'ok');
        reload();
      }));
    },
  },

  users: {
    label: 'Pengguna & Hak Akses',
    perm: 'user.manage',
    async render(el) {
      const [u, roles] = await Promise.all([api('/users'), api('/roles')]), reload = () => this.render(el);
      el.innerHTML = `<div class="head"><h1>Pengguna &amp; Hak Akses</h1><button class="btn primary" id="add">+ Tambah Pengguna</button></div>
      ${table([
        { h: 'Username', f: r => `<b>${esc(r.username)}</b><br><span class="mute small">${esc(r.nama_lengkap)}</span>` },
        { h: 'Peran & Cakupan RS', f: r => `${esc(r.role_kode)}${r.scoped_rs_id ? `<br><span class="badge">RS: ${esc(r.scoped_rs_id)}</span>` : '<br><span class="mute small">Semua RS</span>'}` },
        { h: 'Status', f: r => `<span class="badge ${r.aktif ? 'b-ok' : 'b-off'}">${r.aktif ? 'aktif' : 'nonaktif'}</span>` },
        { h: 'Login Terakhir', f: r => fmtDT(r.last_login) },
        { h: 'Aksi', cls: 'act', f: r => `<button class="btn sm" data-a="edit" data-id="${r.id}">Ubah</button> ${r.id !== S.me.id ? `<button class="btn sm danger" data-a="del" data-id="${r.id}">Hapus</button>` : ''}` }
      ], u.items)}
      <div class="panel" style="margin-top:1rem"><h3>Matriks Peran &amp; Hak Akses</h3>
        ${roles.map(r => `<p><b>${esc(r.kode)}</b> <span class="mute small">— ${esc(r.deskripsi)}</span><br>${r.permissions.map(p => `<span class="badge">${esc(p)}</span>`).join(' ')}</p>`).join('')}</div>`;
      const roleOpts = roles.map(r => r.kode);
      $('#add', el).onclick = () => openForm({
        title: 'Tambah Pengguna Staf',
        fields: [
          { name: 'username', label: 'Username (huruf/angka/_.-)', required: true, minlength: 3, autocomplete: 'off' },
          { name: 'nama_lengkap', label: 'Nama Lengkap', required: true },
          { name: 'password', label: 'Kata Sandi (min. 8 karakter)', type: 'password', required: true, minlength: 8, autocomplete: 'new-password' },
          { name: 'role_kode', label: 'Peran', type: 'select', options: roleOpts, value: 'operator' },
          { name: 'scoped_rs_id', label: 'Batasi ke 1 Rumah Sakit (opsional, kosongkan = Semua RS)', type: 'rs' }],
        onSubmit: async v => { await api('/users', { method: 'POST', body: v }); toast('Pengguna dibuat', 'ok'); reload(); },
      });
      el.onclick = e => {
        const b = e.target.closest('[data-a]');
        if (!b) return;
        const id = b.dataset.id, r = u.items.find(x => x.id === Number(id));
        if (b.dataset.a === 'edit') openForm({
          title: 'Ubah ' + r.username,
          note: 'Kosongkan kata sandi bila tidak diganti. Perubahan peran atau status memaksa pengguna masuk ulang.',
          fields: [
            { name: 'nama_lengkap', label: 'Nama Lengkap', required: true, value: r.nama_lengkap },
            { name: 'role_kode', label: 'Peran', type: 'select', options: roleOpts, value: r.role_kode },
            { name: 'password', label: 'Kata Sandi Baru', type: 'password', nullable: true, autocomplete: 'new-password' },
            { name: 'aktif', label: '', type: 'checkbox', hint: 'Akun aktif', value: r.aktif }],
          onSubmit: async v => { if (v.password === null || v.password === '') delete v.password; await api('/users/' + id, { method: 'PUT', body: v }); toast('Pengguna diperbarui', 'ok'); reload(); },
        });
        else confirmAct('Hapus pengguna ' + r.username + '?', async () => { await api('/users/' + id, { method: 'DELETE' }); toast('Pengguna dihapus', 'ok'); reload(); });
      };
    },
  },

  audit: {
    label: 'Log Aktivitas',
    perm: 'audit.read',
    st: { limit: 25, offset: 0, tabel: '', aktor: '' },
    async render(el) {
      const st = this.st, reload = () => this.render(el), d = await api('/audit?' + qs(st));
      el.innerHTML = `<div class="head"><h1>Log Aktivitas Operasional</h1></div><p class="mute small">Catatan perubahan data operasional sistem secara otomatis untuk keperluan pengawasan.</p>
      <div class="filters"><select id="ft"><option value="">Semua kategori data</option>${[
        ['booking_kamar', 'Booking Kamar'],
        ['kuota_kamar', 'Kuota Kamar'],
        ['jadwal_konsultasi', 'Jadwal Dokter'],
        ['reservasi_konsultasi', 'Reservasi Poliklinik'],
        ['admin_users', 'Pengguna Admin'],
      ].map(([val, lab]) => `<option value="${val}" ${st.tabel === val ? 'selected' : ''}>${lab}</option>`).join('')}</select>
        <input id="fa" placeholder="Filter operator (username)" value="${esc(st.aktor)}"></div>
      ${table([
        { h: 'Waktu', f: r => fmtDT(r.waktu) },
        { h: 'Operator', f: r => esc(r.aktor) },
        { h: 'Tindakan', f: r => `<span class="badge">${esc(r.aksi)}</span>` },
        { h: 'Modul Data', f: r => esc(r.tabel) },
        { h: 'ID Data', f: r => esc(r.record_id) },
        { h: 'Perubahan (Visual Diff)', f: r => `${renderAuditDiff(r.data_lama, r.data_baru)}<details style="margin-top:.3rem"><summary class="small mute">JSON lengkap</summary>${r.data_lama ? `<div class="small mute">Sebelum</div><pre>${esc(JSON.stringify(r.data_lama, null, 1))}</pre>` : ''}${r.data_baru ? `<div class="small mute">Sesudah</div><pre>${esc(JSON.stringify(r.data_baru, null, 1))}</pre>` : ''}</details>` },
        { h: 'Aksi', f: r => `<button class="btn sm" data-rb="${r.id}" title="Kembalikan data sebelum perubahan ini">Pulihkan</button>` }
      ], d.items, 'Belum ada catatan aktivitas.')}
      ${pager(st, d.total)}`;
      bindPager(el, st, reload);
      el.querySelectorAll('[data-rb]').forEach(btn => {
        btn.onclick = () => {
          const aid = btn.dataset.rb;
          confirmAct(`Pulihkan data ke kondisi sebelum audit #${aid}?`, async () => {
            const res = await api(`/audit/${aid}/rollback`, { method: 'POST' });
            toast(res.message || 'Data berhasil dipulihkan', 'ok');
            reload();
          });
        };
      });
      $('#ft', el).onchange = e => { st.tabel = e.target.value; st.offset = 0; reload(); };
      let t;
      $('#fa', el).oninput = e => { clearTimeout(t); t = setTimeout(() => { st.aktor = e.target.value.trim(); st.offset = 0; reload(); }, 350); };
    },
  },
};

/* ---------- Shell ---------- */
async function show(id) {
  const v = VIEWS[id];
  if (!v || !can(v.perm)) return;
  S.view = id;
  renderNav();
  const el = $('#view');
  el.innerHTML = '<p class="mute">Memuat data…</p>';
  try {
    await v.render(el);
  } catch (e) {
    el.innerHTML = `<div class="panel"><b>Gagal memuat halaman.</b><p class="mute">${esc(e.message)}</p></div>`;
  }
}

function renderNav() {
  $('#nav').innerHTML = Object.entries(VIEWS)
    .filter(([, v]) => can(v.perm))
    .map(([id, v]) => `<button data-v="${id}" class="${S.view === id ? 'on' : ''}">${esc(v.label)}</button>`)
    .join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.v));
}

async function enter() {
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#who-name').textContent = S.me.nama_lengkap;
  $('#who-role').textContent = S.me.role_kode + ' · ' + S.me.username;
  try {
    S.rs = await api('/hospitals');
    S.rsMap = Object.fromEntries(S.rs.map(h => [h.id, h.nama]));
  } catch (e) {
    toast('Daftar rumah sakit gagal dimuat: ' + e.message, 'err');
  }
  show(S.view in VIEWS && can(VIEWS[S.view].perm) ? S.view : 'dashboard');
}

function doLogout(expired) {
  if (S.token && !expired) api('/logout', { method: 'POST' }).catch(() => {});
  S.token = null;
  S.me = null;
  localStorage.removeItem(TOKEN_KEY);
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  closeModal();
  if (expired) $('#login-err').textContent = 'Sesi berakhir, silakan masuk kembali.';
}

$('#logout').onclick = () => doLogout(false);
$('#login-form').onsubmit = async e => {
  e.preventDefault();
  $('#login-err').textContent = '';
  $('#login-btn').disabled = true;
  try {
    const r = await api('/login', { method: 'POST', body: { username: $('#lu').value.trim(), password: $('#lp').value } });
    S.token = r.token;
    S.me = r.user;
    localStorage.setItem(TOKEN_KEY, r.token);
    $('#lp').value = '';
    await enter();
  } catch (err) {
    $('#login-err').textContent = err.message;
  } finally {
    $('#login-btn').disabled = false;
  }
};

(async () => {
  if (!S.token) return;
  try {
    S.me = await api('/me');
    await enter();
  } catch (e) {
    doLogout(false);
  }
})();
</script>
