<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1F6F8B">
  <title>SPARQL | CariSehat</title>
  <link rel="icon" type="image/png" href="/images/cari-sehat-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- YASGUI dari CDN. Jika gagal dimuat, coba paket @triply/yasgui dengan path build yang sama. -->
  <link rel="stylesheet" href="https://unpkg.com/@matdata/yasgui/build/yasgui.min.css">
  <style>
    :root{--ink:#14232B;--toba:#1F6F8B;--toba-d:#15556B;--toba-soft:#EAF3F6;--mute:#5B6E77;--line:#DCE6EA}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#F6F8F9;-webkit-font-smoothing:antialiased}
    a{color:var(--toba);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
    :focus-visible{outline:3px solid var(--toba);outline-offset:2px;border-radius:6px}
    header{display:flex;align-items:center;flex-wrap:wrap;gap:.6rem 1rem;padding:.65rem 1.1rem;background:#fff}
    .brand{display:flex;align-items:center;gap:.55rem;color:var(--ink);font-weight:800;font-size:1.05rem}
    .brand:hover{text-decoration:none}
    .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,var(--toba),var(--toba-d));display:grid;place-items:center}
    .brand span span{color:var(--toba)}
    .ep{margin-left:auto;font-size:.82rem;color:var(--mute);display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
    .ep code{background:var(--toba-soft);color:var(--toba-d);border-radius:7px;padding:.2rem .55rem;font-weight:700;font-size:.8rem}
    .ep .ro{font-weight:700;font-size:.72rem;background:#EEF1F2;border-radius:99px;padding:.15rem .6rem}
    .back{font-size:.86rem;padding:.4rem .8rem;border-radius:99px;background:var(--toba-soft);color:var(--toba-d)}
    .ulos{height:7px;background:repeating-linear-gradient(90deg,#B3262E 0 14px,#14232B 14px 18px,#C8922E 18px 20px,#F6F8F9 20px 24px,#B3262E 24px 38px)}
    #yasgui{padding:.8rem 1rem 2rem;max-width:1400px;margin:0 auto}
    /* sentuhan tema pada YASGUI */
    .yasgui .tabsList .tab.active{border-bottom-color:var(--toba)!important}
    .yasgui .autocompleteWrapper,.yasgui .controlbar{font-family:inherit}
    .yasqe .yasqe_buttons .yasqe_share{display:none}
    .yasgui .yasqe_queryButton{background:var(--toba)!important;border-color:var(--toba)!important}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/"><img src="/images/cari-sehat-logo.png?v=2" alt="Cari Sehat" width="174" height="59" style="object-fit:contain;max-width:38vw"><span>SPARQL</span></a>
    <a class="back" href="/">&larr; Pencarian</a>
    <div class="ep">Endpoint: <code>/sparql/query</code><span class="ro">hanya baca</span></div>
  </header>
  <div class="ulos" aria-hidden="true"></div>
  <div id="yasgui"></div>
  <script src="https://unpkg.com/@matdata/yasgui/build/yasgui.min.js"></script>
  <script>
    new Yasgui(document.getElementById("yasgui"), {
      requestConfig: { endpoint: location.origin + "/sparql/query" },
      copyEndpointOnNewTab: false
    });
  </script>
</body>
</html>
